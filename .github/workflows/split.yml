name: Split

on:
  # Started periodically, to keep the cache alive and to process what didn't start the split
  # (late at night in Portland)
  schedule:
    - cron: "30 10 * * 1,4"
  # Started by the "Notify splitter" workflow of the source repository, or manually
  workflow_dispatch:
    inputs:
      from-scratch:
        description: Process the whole source repository again, ignoring the data saved by the previous runs (it takes about 20 minutes)
        type: boolean
        default: false
      save-work-directory:
        description: Save the working directory as an artifact of the run, for debugging purposes
        type: boolean
        default: false

# Never run two splits at the same time (that's why incremental-git-filterbranch is executed with the --no-lock option)
concurrency:
  group: split
  cancel-in-progress: false

permissions:
  # Required to delete the caches of the previous runs
  actions: write
  # Required to push the branches and the tags to this repository
  contents: write

env:
  SOURCE_REPOSITORY: https://github.com/concretecms/concretecms.git
  DESTINATION_REPOSITORY: https://github.com/${{ github.repository }}.git
  # The branch of this repository that contains this workflow: it must be the default branch
  SPLITTER_BRANCH: core-splitter
  # The branches and the tags of the source repository to be processed
  # (see the --branch-whitelist and --tag-blacklist options of incremental-git-filterbranch).
  # These values are also read by the "Notify splitter" workflow of the source repository: don't rename or move them
  BRANCH_WHITELIST: master rx:.+\.x rx:.+-dev rx:release/.*
  TAG_BLACKLIST: rx:5\..*
  INCREMENTAL_FILTER_BRANCH_VERSION: 2.2.1

jobs:
  split:
    name: Split
    # Don't run in the forks of this repository
    if: github.repository == 'concretecms/concretecms-core'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download incremental-git-filterbranch
        run: >
          curl
          --silent
          --show-error
          --fail
          --location
          --retry 5
          --retry-delay 10
          --retry-all-errors
          --output incremental-git-filterbranch
          "https://raw.githubusercontent.com/concretecms/incremental-filter-branch/$INCREMENTAL_FILTER_BRANCH_VERSION/bin/incremental-git-filterbranch"
          &&
          chmod +x incremental-git-filterbranch
      - name: Restore working directory
        id: restore
        if: inputs.from-scratch != true
        uses: actions/cache/restore@v6
        with:
          path: work
          # A cache can't be updated: we save a new one at every run, restoring the most recent one
          key: work-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: work-
      - name: Show git version
        run: git --version
      - name: Split
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Let git use the token of GitHub Actions for the destination repository only, without saving it in the working directory
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$authorization"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.$DESTINATION_REPOSITORY.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: Basic $authorization"
          ./incremental-git-filterbranch \
            --workdir "$PWD/work" \
            --no-lock \
            --branch-whitelist "$BRANCH_WHITELIST" \
            --tag-blacklist "$TAG_BLACKLIST" \
            --prune-branches \
            --prune-branches-exclude "$SPLITTER_BRANCH" \
            --prune-tags \
            --tags-plan all \
            -- \
            "$SOURCE_REPOSITORY" \
            '--prune-empty --subdirectory-filter concrete' \
            "$DESTINATION_REPOSITORY"
      - name: Optimize working directory
        env:
          # The aggressive optimization takes some minutes, but it greatly reduces the size of the working directory:
          # we use it in the scheduled runs, and when the working directory has just been created
          GC_OPTIONS: ${{ (github.event_name == 'schedule' || steps.restore.outputs.cache-matched-key == '') && '--aggressive' || '' }}
        run: |
          for repository in work/source-* work/worker-*; do
            if [ -f "$repository/config" ]; then
              echo "::group::Optimizing $repository"
              git -C "$repository" gc $GC_OPTIONS
              echo '::endgroup::'
            fi
          done
      - name: Save working directory
        uses: actions/cache/save@v6
        with:
          path: work
          key: work-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Delete previous working directories
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_KEY: work-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key work- --limit 100 --json key --jq '.[].key' | while read -r key; do
            if [ "$key" != "$CURRENT_KEY" ]; then
              gh cache delete "$key" --repo "$GITHUB_REPOSITORY"
            fi
          done
      - name: Create archive of the working directory
        id: archive
        if: always() && inputs.save-work-directory == true
        run: |
          if [ -d work ]; then
            tar --create --file work.tar work
            echo 'created=yes' >>"$GITHUB_OUTPUT"
          else
            echo '::warning::The working directory does not exist: it can not be saved'
          fi
      - name: Save archive of the working directory
        if: always() && steps.archive.outputs.created == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: work
          path: work.tar
          if-no-files-found: error
          retention-days: 3
          # The working directory mainly contains data that's already compressed
          compression-level: 0
